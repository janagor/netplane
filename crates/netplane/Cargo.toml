[package]
name = "netplane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "A composable Rust networking runtime built on Tower, providing dynamically reconfigurable service graphs with explicit lifecycle, backpressure, and cancellation semantics."
include = ["/src", "README.md", "LICENSE"]
publish = false

[lints]
workspace = true

[dependencies]
arc-swap.workspace = true
pin-project-lite.workspace = true
tower.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["filter"] }
