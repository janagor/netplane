[package]
name = "netplane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
description = "A composable Rust networking runtime built on Tower, providing dynamically reconfigurable service graphs with explicit lifecycle, backpressure, and cancellation semantics."
include = ["/src", "/tests", "/examples", "/benches", "README.md", "LICENSE"]
publish = false

[lib]
bench = false

[lints]
workspace = true

[dependencies]
tracing.workspace = true
arc-swap.workspace = true
pin-project-lite.workspace = true
tower.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
criterion.workspace = true
futures-util.workspace = true
tracing-subscriber = { version = "0.3", features = ["registry", "fmt", "env-filter"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true, features = ["filter"] }

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "concurrency"
harness = false

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "lifecycle"
harness = false
