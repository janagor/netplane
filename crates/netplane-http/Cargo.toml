[package]
name = "netplane-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded HTTP adapter for Netplane"
publish = false

[[example]]
name = "policy_gateway"
path = "examples/policy_gateway/main.rs"
test = true

[lints]
workspace = true

[dependencies]
netplane = { version = "0.0.0", path = "../netplane" }
axum.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tower.workspace = true

[dev-dependencies]
futures-util.workspace = true
httparse.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util", "signal", "test-util"] }
