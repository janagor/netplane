[package]
name = "netplane-kubernetes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kubernetes endpoint discovery and bounded Netplane configuration integration"
publish = false

[[example]]
name = "discovered_gateway"
test = true

[lints]
workspace = true

[dependencies]
netplane = { version = "0.0.0", path = "../netplane" }
