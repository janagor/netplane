---
metadata:
  project_name: "netplane"
  description: >-
    Early stage Rust library for dynamically reconfigurable Tower service graphs
  format_version: "1.0"
  last_updated: 2026-10-14

mission:
  statement: >-
    Build a reusable Tower-based graph runtime with explicit lifecycle,
    readiness, backpressure, and cancellation semantics
  scope:
    - Transport-independent in-memory prototype first
    - Immutable graph-version publication
    - Testable request and resource lifetimes

constraints:
  hard:
    - name: tower_interoperability
      value: true
    - name: bounded_resources
      value: true
    - name: transport_independent_core
      value: true

stack:
  language: "Rust"
  edition: "2024"
  msrv: "1.88"

conventions:
  testing: "Use mock Tower services for core behavior tests."
  async: "Keep readiness and dispatch on the same service version; bound concurrency."
