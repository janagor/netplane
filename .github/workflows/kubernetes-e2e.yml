name: Kubernetes end-to-end
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/netplane/**'
      - 'crates/netplane-control/**'
      - 'crates/netplane-http/**'
      - 'crates/netplane-kubernetes/**'
      - 'tests/kubernetes/**'
      - 'scripts/kubernetes-e2e.sh'
      - 'tests/kubernetes_script_test.sh'
      - 'docs/kubernetes-integration-testing.md'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.dockerignore'
      - '.github/workflows/kubernetes-e2e.yml'
permissions:
  contents: read
concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned tools
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup override set 1.88.0
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.32.11/bin/linux/amd64/kubectl
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Deterministic discovery recovery
        run: |
          cp tests/kubernetes/Cargo.lock Cargo.lock
          cargo test --locked -p netplane-kubernetes --lib -- --test-threads=1
          cargo test --locked -p netplane-kubernetes-e2e --bins
          cargo test --locked -p netplane-kubernetes-e2e --test expired_watch
      - name: Verify orchestration cleanup
        run: bash tests/kubernetes_script_test.sh
      - name: Run real cluster scenarios
        run: ./scripts/kubernetes-e2e.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kubernetes-diagnostics
          path: |
            artifacts/kubernetes/**
            !artifacts/kubernetes/**/kubeconfig
          if-no-files-found: warn
          retention-days: 7
