name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and Clippy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Verify public rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  test:
    name: Build and test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rust: '1.88' }
          - { os: ubuntu-latest, rust: stable }
          - { os: macos-latest, rust: '1.88' }
          - { os: windows-latest, rust: '1.88' }
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ matrix.rust }}
      - run: rustc --version
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --doc
      - name: Compile core benchmarks on MSRV
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.88'
        run: cargo bench -p netplane --no-run
      - name: Smoke-test core benchmarks on MSRV
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.88'
        run: cargo test -p netplane --benches
      - name: Smoke-test operational harness on MSRV
        if: matrix.os == 'ubuntu-latest' && matrix.rust == '1.88'
        run: |
          cargo run --release -p netplane --example operational_probe -- --profile smoke --scenario two-balanced --output target/operational-smoke.json
          python3 -c 'import json; r=json.load(open("target/operational-smoke.json")); m=r["metrics"]; assert r["schema_version"]==2; assert m["measurement_complete"] is True; assert m["missing_latency_samples"]==0; assert m["completed"]>0 and m["completed"]==m["admitted"] and m["runtime_errors"]==0'
      - name: Verify library package
        if: matrix.os == 'ubuntu-latest'
        run: cargo package -p netplane

  runtime-stress:
    name: Runtime stress (${{ matrix.workers }} workers)
    strategy:
      fail-fast: false
      matrix:
        workers: ${{ fromJSON(github.event_name == 'schedule' && '[2,4,8]' || '[4]') }}
    runs-on: ubuntu-latest
    env:
      NETPLANE_STRESS_RUNS: ${{ github.event_name == 'schedule' && '1000' || '100' }}
      NETPLANE_STRESS_THREADS: ${{ matrix.workers }}
      NETPLANE_STRESS_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.88"
      - run: cargo test -p netplane --test stress_randomized -- --nocapture

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.88"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  docs:
    name: Build mdBook
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify generated LLM documentation
        run: |
          bash tests/generate_llms_txt_test.sh
          bash scripts/generate-llms-txt.sh
          git diff --exit-code -- llms.txt llms-full.txt
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2
        with:
          tool: mdbook
      - run: mdbook build docs
